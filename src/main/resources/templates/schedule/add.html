<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Thêm lịch chiếu')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('schedules')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Lịch chiếu', '/admin/schedules', 'Thêm mới')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Thêm lịch chiếu</h1>
                    <p>Mỗi phòng chỉ có một suất chiếu tại cùng ngày và khung giờ.</p>
                </div>
            </div>

            <div class="form-narrow"><div th:replace="~{fragments/admin :: flash}"></div></div>

            <form th:action="@{/admin/schedules/add}" method="post" class="form-narrow">
                <section class="panel">
                    <div class="panel-body">
                        <div class="mb-3">
                            <label class="form-label" for="movieId">Phim<span class="req">*</span></label>
                            <div class="input-icon">
                                <i class="bi bi-film"></i>
                                <select id="movieId" name="movieId" class="form-select" required>
                                    <option value="">— Chọn phim —</option>
                                    <option th:each="m : ${movies}" th:value="${m.idPhim}" th:text="${m.tenPhim}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label" for="roomId">Phòng chiếu<span class="req">*</span></label>
                                <div class="input-icon">
                                    <i class="bi bi-door-open"></i>
                                    <select id="roomId" name="roomId" class="form-select" required>
                                        <option value="">— Chọn phòng —</option>
                                        <option th:each="r : ${rooms}" th:value="${r.idPhongChieu}" th:text="${r.tenPhongChieu}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="ngayChieu">Ngày chiếu<span class="req">*</span></label>
                                <input type="date" id="ngayChieu" name="ngayChieu" class="form-control" required/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="showTimeId">Khung giờ<span class="req">*</span></label>
                                <div class="input-icon">
                                    <i class="bi bi-clock"></i>
                                    <select id="showTimeId" name="showTimeId" class="form-select" required>
                                        <option value="">— Chọn giờ —</option>
                                        <option th:each="st : ${showTimes}" th:value="${st.idXuatChieu}"
                                                th:text="${#temporals.format(st.khungGio, 'HH:mm')}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/schedules}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Thêm lịch chiếu</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
