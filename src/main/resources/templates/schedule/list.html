<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý lịch chiếu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4e73df;
            --secondary: #6f42c1;
            --success: #1cc88a;
            --info: #36b9cc;
            --warning: #f6c23e;
            --danger: #e74a3b;
            --light: #f8f9fc;
            --dark: #5a5c69;
        }
        
        body {
            background-color: #f8f9fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 1.5rem;
            margin: -1rem -1rem 2rem -1rem;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .schedule-card {
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 1.5rem;
            background: white;
            overflow: hidden;
            border-left: 4px solid var(--primary);
        }
        
        .schedule-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        .schedule-header {
            background: linear-gradient(90deg, rgba(78, 115, 223, 0.1) 0%, rgba(111, 66, 193, 0.1) 100%);
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }
        
        .schedule-id {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.9rem;
        }
        
        .schedule-body {
            padding: 1.25rem;
        }
        
        .movie-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }
        
        .schedule-detail {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }
        
        .schedule-detail i {
            width: 20px;
            color: var(--primary);
        }
        
        .schedule-status {
            display: inline-block;
            padding: 0.35rem 0.65rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }
        
        .action-buttons {
            border-top: 1px solid #eee;
            padding: 1rem;
            background-color: #f8f9fc;
        }
        
        .action-buttons .btn {
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }
        
        .table-view {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .view-toggle {
            margin-bottom: 1rem;
            text-align: right;
        }
        
        .view-toggle .btn {
            border-radius: 20px;
            margin-left: 0.5rem;
        }
        
        .table thead th {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
        }
        
        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
        }
        
        .card-view {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        
        .card-view .schedule-card {
            flex: 0 0 calc(50% - 1.5rem);
        }
        
        .filter-section {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        @media (max-width: 992px) {
            .card-view .schedule-card {
                flex: 0 0 100%;
            }
        }
        
        @media (max-width: 768px) {
            .table-responsive {
                overflow-x: auto;
            }
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #dee2e6;
        }
        
        .date-badge {
            background-color: var(--info);
            color: white;
            padding: 0.35rem 0.65rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body class="container mt-4">
    <!-- Header -->
    <div class="page-header">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="bi bi-calendar-event me-2"></i>Quản lý lịch chiếu</h1>
            <a th:href="@{/admin}" class="btn btn-light">
                <i class="bi bi-arrow-left me-1"></i>Về Dashboard
            </a>
        </div>
    </div>

    <!-- Controls -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
        <form method="get" th:action="@{/admin/schedules}" class="row g-3">
            <div class="col-md-4">
                <select name="movieId" class="form-select">
                    <option value="">-- Tất cả phim --</option>
                    <option th:each="m : ${movies}"
                            th:value="${m.idPhim}"
                            th:text="${m.tenPhim}"
                            th:selected="${currentMovieId == m.idPhim}">
                    </option>
                </select>
            </div>

            <div class="col-md-3">
                <select name="status" class="form-select">
                    <option value="">-- Tất cả trạng thái --</option>
                    <option value="1" th:selected="${currentStatus == 1}">Hoạt động</option>
                    <option value="0" th:selected="${currentStatus == 0}">Đã khóa</option>
                </select>
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-funnel"></i> Lọc
                </button>
            </div>
        </form>


        <div>
            <a th:href="@{/admin/schedules/add}" class="btn btn-success">
                <i class="bi bi-plus-circle me-1"></i>Thêm lịch chiếu
            </a>
        </div>
    </div>

    <!-- View Toggle -->
    <div class="view-toggle">
        <button id="cardViewBtn" class="btn btn-primary">
            <i class="bi bi-grid-3x3-gap"></i> Xem dạng thẻ
        </button>
        <button id="tableViewBtn" class="btn btn-outline-primary">
            <i class="bi bi-list"></i> Xem dạng bảng
        </button>
    </div>

    <!-- Card View -->
    <div id="cardView" class="card-view">
        <th:block th:if="${schedules != null and !schedules.empty}">
            <div th:each="s : ${schedules}" class="schedule-card">
                <div class="schedule-header d-flex justify-content-between align-items-center">
                    <div class="schedule-id" th:text="'Mã lịch: ' + ${s.idLichChieu}"></div>
                    <span th:class="${s.status == 1} ? 'schedule-status bg-success' : 'schedule-status bg-danger'"
                          th:text="${s.status == 1} ? 'Đang hoạt động' : 'Đã khóa'">
                    </span>
                </div>
                
                <div class="schedule-body">
                    <h5 class="movie-title" th:text="${s.movie.tenPhim}"></h5>
                    
                    <div class="schedule-detail">
                        <i class="bi bi-building"></i>
                        <span th:text="${s.room.tenPhongChieu}"></span>
                    </div>
                    
                    <div class="schedule-detail">
                        <i class="bi bi-calendar-date"></i>
                        <span th:text="${s.ngayChieu}"></span>
                    </div>
                    
                    <div class="schedule-detail">
                        <i class="bi bi-clock"></i>
                        <span th:text="${s.showTime.khungGio}"></span>
                    </div>
                </div>
                
                <div class="action-buttons d-flex justify-content-end">
                    <a th:href="@{'/admin/schedules/edit/' + ${s.idLichChieu}}" class="btn btn-primary btn-sm">
                        <i class="bi bi-pencil"></i> Sửa
                    </a>
                    <form th:action="@{'/admin/schedules/status/' + ${s.idLichChieu}}" method="post">
                        <button type="submit" class="btn btn-warning btn-sm">
                            <span th:if="${s.status == 1}"><i class="bi bi-lock"></i> Khóa</span>
                            <span th:if="${s.status == 0}"><i class="bi bi-unlock"></i> Mở</span>
                        </button>
                    </form>
                </div>
            </div>
        </th:block>
        
        <th:block th:if="${schedules == null or schedules.empty}">
            <div class="empty-state w-100">
                <i class="bi bi-calendar-x"></i>
                <h4>Chưa có lịch chiếu nào</h4>
                <p>Hãy thêm lịch chiếu mới để bắt đầu quản lý</p>
                <a th:href="@{/admin/schedules/add}" class="btn btn-primary mt-2">
                    <i class="bi bi-plus-circle me-1"></i>Thêm lịch chiếu
                </a>
            </div>
        </th:block>
    </div>

    <!-- Table View -->
    <div id="tableView" class="table-view" style="display: none;">
        <th:block th:if="${schedules != null and !schedules.empty}">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Phim</th>
                            <th>Phòng</th>
                            <th>Ngày chiếu</th>
                            <th>Khung giờ</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${schedules}">
                            <td th:text="${s.idLichChieu}"></td>
                            <td th:text="${s.movie.tenPhim}"></td>
                            <td th:text="${s.room.tenPhongChieu}"></td>
                            <td th:text="${s.ngayChieu}"></td>
                            <td th:text="${s.showTime.khungGio}"></td>
                            <td>
                                <span th:if="${s.status == 1}" class="badge bg-success">Hoạt động</span>
                                <span th:if="${s.status == 0}" class="badge bg-danger">Khóa</span>
                            </td>
                            <td>
                                <a th:href="@{'/admin/schedules/edit/' + ${s.idLichChieu}}" class="btn btn-primary btn-sm">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{'/admin/schedules/status/' + ${s.idLichChieu}}" method="post" style="display:inline">
                                    <button type="submit" class="btn btn-warning btn-sm">
                                        <span th:if="${s.status == 1}"><i class="bi bi-lock"></i></span>
                                        <span th:if="${s.status == 0}"><i class="bi bi-unlock"></i></span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </th:block>
        
        <th:block th:if="${schedules == null or schedules.empty}">
            <div class="empty-state">
                <i class="bi bi-calendar-x"></i>
                <h4>Chưa có lịch chiếu nào</h4>
                <p>Hãy thêm lịch chiếu mới để bắt đầu quản lý</p>
                <a th:href="@{/admin/schedules/add}" class="btn btn-primary mt-2">
                    <i class="bi bi-plus-circle me-1"></i>Thêm lịch chiếu
                </a>
            </div>
        </th:block>
    </div>

    <script>
        // Xử lý chuyển đổi giữa chế độ xem thẻ và xem bảng
        document.getElementById('cardViewBtn').addEventListener('click', function() {
            document.getElementById('cardView').style.display = 'flex';
            document.getElementById('tableView').style.display = 'none';
            this.classList.add('btn-primary');
            this.classList.remove('btn-outline-primary');
            document.getElementById('tableViewBtn').classList.add('btn-outline-primary');
            document.getElementById('tableViewBtn').classList.remove('btn-primary');
        });

        document.getElementById('tableViewBtn').addEventListener('click', function() {
            document.getElementById('cardView').style.display = 'none';
            document.getElementById('tableView').style.display = 'block';
            this.classList.add('btn-primary');
            this.classList.remove('btn-outline-primary');
            document.getElementById('cardViewBtn').classList.add('btn-outline-primary');
            document.getElementById('cardViewBtn').classList.remove('btn-primary');
        });

        // Mặc định hiển thị chế độ xem thẻ
        document.getElementById('tableViewBtn').click();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
