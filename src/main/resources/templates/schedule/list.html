<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Lịch chiếu')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('schedules')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Lịch chiếu')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Lịch chiếu</h1>
                    <p><span th:text="${schedules != null ? schedules.size() : 0}">0</span> suất chiếu</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/admin/schedules/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm lịch chiếu</a>
                </div>
            </div>

            <div class="toolbar">
                <form method="get" th:action="@{/admin/schedules}" class="toolbar-left">
                    <div class="input-icon" style="min-width:240px">
                        <i class="bi bi-film"></i>
                        <select name="movieId" class="form-select" aria-label="Lọc theo phim" onchange="this.form.submit()">
                            <option value="">Tất cả phim</option>
                            <option th:each="m : ${movies}" th:value="${m.idPhim}" th:text="${m.tenPhim}"
                                    th:selected="${currentMovieId == m.idPhim}"></option>
                        </select>
                    </div>
                    <select name="status" class="form-select" style="width:auto" aria-label="Lọc theo trạng thái" onchange="this.form.submit()">
                        <option value="">Mọi trạng thái</option>
                        <option value="1" th:selected="${currentStatus == 1}">Hoạt động</option>
                        <option value="0" th:selected="${currentStatus == 0}">Đã khóa</option>
                    </select>
                    <a th:if="${currentMovieId != null or currentStatus != null}" th:href="@{/admin/schedules}" class="btn btn-light">
                        <i class="bi bi-x-lg"></i>Bỏ lọc
                    </a>
                    <noscript><button type="submit" class="btn btn-light">Lọc</button></noscript>
                </form>
                <div class="toolbar-right">
                    <div class="seg" data-view-toggle="table" role="group" aria-label="Chế độ xem">
                        <button type="button" data-view="table"><i class="bi bi-list-ul"></i>Bảng</button>
                        <button type="button" data-view="card"><i class="bi bi-grid"></i>Thẻ</button>
                    </div>
                </div>
            </div>

            <th:block th:if="${schedules != null and !schedules.empty}">
                <!-- Dạng bảng -->
                <section class="panel" data-view-panel="table">
                    <div class="table-wrap">
                        <table class="table table-modern table-hover">
                            <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Phim</th>
                                <th>Phòng</th>
                                <th>Ngày chiếu</th>
                                <th>Giờ</th>
                                <th>Trạng thái</th>
                                <th class="actions-col">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="s : ${schedules}">
                                <td class="id-col" th:text="'#' + ${s.idLichChieu}"></td>
                                <td class="fw-600" th:text="${s.movie.tenPhim}"></td>
                                <td th:text="${s.room.tenPhongChieu}"></td>
                                <td class="text-nowrap" th:text="${#temporals.format(s.ngayChieu, 'dd/MM/yyyy')}"></td>
                                <td><span class="tag" th:text="${#temporals.format(s.showTime.khungGio, 'HH:mm')}"></span></td>
                                <td><span th:replace="~{fragments/admin :: activeStatus(${s.status}, 'Hoạt động', 'Đã khóa')}"></span></td>
                                <td class="actions-col">
                                    <div class="row-actions">
                                        <a th:if="${canEditMap[s.idLichChieu]}" th:href="@{'/admin/schedules/edit/' + ${s.idLichChieu}}"
                                           class="btn btn-light btn-icon btn-sm" title="Sửa"><i class="bi bi-pencil"></i></a>
                                        <span th:unless="${canEditMap[s.idLichChieu]}" class="btn btn-light btn-icon btn-sm disabled"
                                              title="Đã có người đặt vé — không thể sửa"><i class="bi bi-pencil"></i></span>
                                        <form th:action="@{'/admin/schedules/status/' + ${s.idLichChieu}}" method="post"
                                              th:data-confirm="${s.status == 1} ? 'Khóa lịch chiếu này? Khách sẽ không thể đặt vé suất này.' : 'Mở lại lịch chiếu này?'">
                                            <button type="submit" class="btn btn-icon btn-sm"
                                                    th:classappend="${s.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'"
                                                    th:title="${s.status == 1} ? 'Khóa' : 'Mở khóa'">
                                                <i class="bi" th:classappend="${s.status == 1} ? 'bi-lock' : 'bi-unlock'"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Dạng thẻ -->
                <div class="card-grid lg" data-view-panel="card" hidden>
                    <div class="tile-card" th:each="s : ${schedules}">
                        <div class="tile-top">
                            <span class="tag" th:text="'#' + ${s.idLichChieu}"></span>
                            <span th:replace="~{fragments/admin :: activeStatus(${s.status}, 'Hoạt động', 'Đã khóa')}"></span>
                        </div>
                        <div>
                            <h3 class="tile-title" th:text="${s.movie.tenPhim}">Phim</h3>
                            <div class="meta mt-2">
                                <span><i class="bi bi-door-open"></i><span th:text="${s.room.tenPhongChieu}"></span></span>
                                <span><i class="bi bi-calendar3"></i><span th:text="${#temporals.format(s.ngayChieu, 'dd/MM/yyyy')}"></span></span>
                                <span><i class="bi bi-clock"></i><span th:text="${#temporals.format(s.showTime.khungGio, 'HH:mm')}"></span></span>
                            </div>
                        </div>
                        <div class="tile-foot">
                            <a th:if="${canEditMap[s.idLichChieu]}" th:href="@{'/admin/schedules/edit/' + ${s.idLichChieu}}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i>Sửa</a>
                            <span th:unless="${canEditMap[s.idLichChieu]}" class="btn btn-light btn-sm disabled" title="Đã có người đặt vé"><i class="bi bi-lock"></i>Đã có vé đặt</span>
                            <form th:action="@{'/admin/schedules/status/' + ${s.idLichChieu}}" method="post"
                                  th:data-confirm="${s.status == 1} ? 'Khóa lịch chiếu này? Khách sẽ không thể đặt vé suất này.' : 'Mở lại lịch chiếu này?'">
                                <button type="submit" class="btn btn-sm" th:classappend="${s.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'">
                                    <th:block th:if="${s.status == 1}"><i class="bi bi-lock"></i>Khóa</th:block>
                                    <th:block th:if="${s.status != 1}"><i class="bi bi-unlock"></i>Mở</th:block>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </th:block>

            <section class="panel" th:if="${schedules == null or schedules.empty}">
                <div class="empty-state">
                    <div class="icon"><i class="bi bi-calendar-x"></i></div>
                    <h5>Không có lịch chiếu nào</h5>
                    <p>Thử bỏ bộ lọc hoặc thêm lịch chiếu mới.</p>
                    <a th:href="@{/admin/schedules/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm lịch chiếu</a>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
