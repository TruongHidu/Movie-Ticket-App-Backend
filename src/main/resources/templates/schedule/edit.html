<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Chỉnh Sửa Lịch Chiếu</h1>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<form th:action="@{/admin/schedules/edit/{id}(id=${schedule.idLichChieu})}" method="post">
    <div class="mb-3">
        <label>Phim</label>
        <select name="movieId" class="form-select" required>
            <option value="">-- Chọn phim --</option>
            <option th:each="m : ${movies}" th:value="${m.idPhim}" 
                    th:text="${m.tenPhim}" 
                    th:selected="${m.idPhim} == ${schedule.movie.idPhim}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Phòng chiếu</label>
        <select name="roomId" class="form-select" required>
            <option value="">-- Chọn phòng --</option>
            <option th:each="r : ${rooms}" th:value="${r.idPhongChieu}" 
                    th:text="${r.tenPhongChieu}" 
                    th:selected="${r.idPhongChieu} == ${schedule.room.idPhongChieu}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Khung giờ</label>
        <select name="showTimeId" class="form-select" required>
            <option value="">-- Chọn khung giờ --</option>
            <option th:each="st : ${showTimes}" th:value="${st.idXuatChieu}" 
                    th:text="${#temporals.format(st.khungGio, 'HH:mm')}" 
                    th:selected="${st.idXuatChieu} == ${schedule.showTime.idXuatChieu}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label>Ngày chiếu</label>
        <input type="date" name="ngayChieu" class="form-control" 
               th:value="${#temporals.format(schedule.ngayChieu, 'yyyy-MM-dd')}" required/>
    </div>

    <button type="submit" class="btn btn-primary">Lưu</button>
    <a th:href="@{/admin/schedules}" class="btn btn-secondary">Hủy</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
