<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý người dùng</title>
</head>
<body>
<h1>Danh sách người dùng</h1>
<a th:href="@{/admin/users/add}">Thêm user</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Email</th>
        <th>Vai trò</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
    </tr>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.role == 1 ? 'Admin' : 'User'}"></td>
        <td>
            <span th:text="${user.status == 1 ? 'Hoạt động' : 'Khóa'}"></span>
        </td>
        <td>
            <a th:href="@{'/admin/users/edit/' + ${user.id}}">Sửa</a> |
            <a th:href="@{'/admin/users/delete/' + ${user.id}}">Xóa</a> |
            <a th:href="@{'/admin/users/status/' + ${user.id} + '/' + ${user.status == 1 ? 0 : 1}}">
                <span th:text="${user.status == 1 ? 'Khóa' : 'Mở'}"></span>
            </a>
        </td>
    </tr>
</table>
</body>
</html>
