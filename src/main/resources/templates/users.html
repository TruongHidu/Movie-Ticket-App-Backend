<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Người dùng')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('users')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Người dùng')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Người dùng</h1>
                    <p><span th:text="${users.size()}">0</span> tài khoản đã đăng ký</p>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="seg" data-status-filter="[data-user-row]" role="group" aria-label="Lọc theo trạng thái">
                        <button type="button" class="active" data-value="">Tất cả</button>
                        <button type="button" data-value="1">Hoạt động</button>
                        <button type="button" data-value="0">Đã khóa</button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="search" class="form-control" placeholder="Tìm theo tên hoặc email…"
                               data-search-target="[data-user-row]" aria-label="Tìm người dùng">
                    </div>
                </div>
            </div>

            <section class="panel">
                <div class="table-wrap" th:if="${!users.isEmpty()}">
                    <table class="table table-modern table-hover">
                        <thead>
                        <tr>
                            <th>Người dùng</th>
                            <th>Vai trò</th>
                            <th class="num">Điểm</th>
                            <th class="num">Tổng chi tiêu</th>
                            <th>Trạng thái</th>
                            <th class="actions-col">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}" data-user-row th:data-status="${user.status}">
                            <td>
                                <div class="cell-media">
                                    <span class="avatar" style="width:36px;height:36px;font-size:13px"
                                          th:style="${user.role == 1} ? 'width:36px;height:36px;font-size:13px' : 'width:36px;height:36px;font-size:13px;background:var(--neutral-soft);color:var(--ink-2)'"
                                          th:text="${#strings.isEmpty(user.name) ? '?' : #strings.toUpperCase(#strings.substring(user.name, 0, 1))}">A</span>
                                    <div>
                                        <div class="title" th:text="${user.name}"></div>
                                        <div class="sub" th:text="${user.email}"></div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span th:if="${user.role == 1}" class="pill pill-accent no-dot"><i class="bi bi-shield-check"></i>Admin</span>
                                <span th:if="${user.role != 1}" class="pill pill-neutral no-dot">Khách hàng</span>
                            </td>
                            <td class="num" th:text="${#numbers.formatInteger(user.point, 1, 'POINT')}"></td>
                            <td class="num money" th:text="${#numbers.formatDecimal(user.totalSpent, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td><span th:replace="~{fragments/admin :: activeStatus(${user.status}, 'Hoạt động', 'Đã khóa')}"></span></td>
                            <td class="actions-col">
                                <div class="row-actions" th:if="${user.role != 1}">
                                    <form th:if="${user.status == 1}" th:action="@{'/admin/users/status/' + ${user.id} + '/0'}" method="post"
                                          data-confirm="Khóa tài khoản này? Người dùng sẽ không thể đăng nhập.">
                                        <button type="submit" class="btn btn-soft-warning btn-sm"><i class="bi bi-lock"></i>Khóa</button>
                                    </form>
                                    <form th:if="${user.status != 1}" th:action="@{'/admin/users/status/' + ${user.id} + '/1'}" method="post">
                                        <button type="submit" class="btn btn-soft-success btn-sm"><i class="bi bi-unlock"></i>Mở khóa</button>
                                    </form>
                                </div>
                                <span th:if="${user.role == 1}" class="text-muted small">—</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="empty-state" th:if="${users.isEmpty()}">
                    <div class="icon"><i class="bi bi-people"></i></div>
                    <h5>Chưa có người dùng</h5>
                    <p>Tài khoản đăng ký từ ứng dụng sẽ xuất hiện ở đây.</p>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
