<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Banner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4e73df;
            --secondary: #6f42c1;
            --success: #1cc88a;
            --info: #36b9cc;
            --warning: #f6c23e;
            --danger: #e74a3b;
            --light: #f8f9fc;
            --dark: #5a5c69;
        }
        
        body {
            background-color: #f8f9fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 1.5rem;
            margin: -1rem -1rem 2rem -1rem;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .table-view {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-bottom: 2rem;
        }
        
        .form-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .table thead th {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-weight: 600;
        }
        
        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
        }
        
        .table tbody tr:hover {
            background-color: #f8f9fc;
        }
        
        .action-buttons .btn {
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }
        
        .banner-image {
            width: 120px;
            height: auto;
            border-radius: 8px;
        }
        
        @media (max-width: 768px) {
            .table-responsive {
                overflow-x: auto;
            }
        }
    </style>
    <script>
        // Hiển thị danh sách movie hoặc promotion tùy loại banner
        function toggleTypeSelect() {
            const type = document.getElementById("typeSelect").value;
            document.getElementById("movieSelect").style.display = type === "MOVIE" ? "block" : "none";
            document.getElementById("promotionSelect").style.display = type === "PROMOTION" ? "block" : "none";
        }
    </script>
</head>
<body class="container mt-4">
    <!-- Header -->
    <div class="page-header">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="bi bi-image me-2"></i>Quản lý Banner</h1>
            <a th:href="@{/admin}" class="btn btn-light">
                <i class="bi bi-arrow-left me-1"></i>Về Dashboard
            </a>
        </div>
    </div>

    <!-- Form Thêm Banner -->
    <div class="form-card">
        <h5 class="mb-3"><i class="bi bi-plus-circle me-2"></i>Thêm Banner Mới</h5>
        <form th:action="@{/admin/banners/add}" method="post" enctype="multipart/form-data" th:object="${bannerRequest}">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Loại Banner</label>
                    <select id="typeSelect" class="form-select" name="type" onchange="toggleTypeSelect()" required>
                        <option value="">-- Chọn loại --</option>
                        <option value="MOVIE">Phim</option>
                        <option value="PROMOTION">Khuyến mãi</option>
                    </select>
                </div>

                <div class="col-md-4" id="movieSelect" style="display:none;">
                    <label class="form-label">Chọn phim</label>
                    <select class="form-select" name="movieId">
                        <option value="">-- Chọn phim --</option>
                        <option th:each="movie : ${movies}"
                                th:value="${movie.idPhim}"
                                th:text="${movie.tenPhim}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4" id="promotionSelect" style="display:none;">
                    <label class="form-label">Chọn khuyến mãi</label>
                    <select class="form-select" name="promotionId">
                        <option value="">-- Chọn khuyến mãi --</option>
                        <option th:each="promo : ${promotions}"
                                th:value="${promo.id}"
                                th:text="${promo.title}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Ảnh banner</label>
                    <input type="file" class="form-control" name="image" accept="image/*" required>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="bi bi-plus-circle me-1"></i>Thêm Banner
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Danh sách Banner -->
    <div class="table-view">
        <div class="p-3">
            <h5 class="mb-3"><i class="bi bi-list-ul me-2"></i>Danh sách Banner</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Loại</th>
                            <th>Hình ảnh</th>
                            <th>Phim / Khuyến mãi</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="banner : ${banners}">
                            <td th:text="${banner.id}"></td>
                            <td>
                                <span th:if="${banner.type.name() == 'MOVIE'}" class="badge bg-primary">Phim</span>
                                <span th:if="${banner.type.name() == 'PROMOTION'}" class="badge bg-success">Khuyến mãi</span>
                            </td>
                            <td>
                                <img th:src="${banner.imageUrl}" alt="Banner" class="banner-image">
                            </td>
                            <td>
                                <span th:if="${banner.type.name() == 'MOVIE'}" th:text="'Phim ID: ' + ${banner.movieId}"></span>
                                <span th:if="${banner.type.name() == 'PROMOTION'}" th:text="'KM ID: ' + ${banner.promotionId}"></span>
                            </td>
                            <td>
                                <span th:if="${banner.status == 1}" class="badge bg-success">Hoạt động</span>
                                <span th:if="${banner.status == 0}" class="badge bg-secondary">Ẩn</span>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <a th:href="@{'/admin/banners/delete/' + ${banner.id}}" class="btn btn-danger btn-sm"
                                       onclick="return confirm('Bạn có chắc muốn xóa banner này?')">
                                        <i class="bi bi-trash"></i> Xóa
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
