<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Thêm phương thức thanh toán')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('payments')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Thanh toán', '/admin/paymentMethod', 'Thêm mới')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Thêm phương thức thanh toán</h1>
                    <p>Phương thức mới có thể dùng ngay sau khi lưu.</p>
                </div>
            </div>

            <form th:action="@{/admin/paymentMethod/add}" th:object="${method}" method="post" enctype="multipart/form-data" class="form-narrow">
                <section class="panel">
                    <div class="panel-body">
                        <div class="mb-3">
                            <label class="form-label" for="nameMethod">Tên phương thức<span class="req">*</span></label>
                            <div class="input-icon">
                                <i class="bi bi-credit-card"></i>
                                <input type="text" id="nameMethod" th:field="*{nameMethod}" class="form-control"
                                       placeholder="VD: VNPay, Ví MoMo, Tiền mặt tại quầy" required maxlength="100">
                            </div>
                            <div class="form-text">Tên này hiển thị cho khách ở bước thanh toán.</div>
                        </div>
                        <div>
                            <label class="form-label">Logo<span class="req">*</span></label>
                            <label class="upload-drop" data-upload data-max-mb="2">
                                <span class="upload-thumb"><i class="bi bi-cloud-arrow-up"></i></span>
                                <span class="upload-meta">
                                    <strong data-upload-name>Kéo thả logo vào đây hoặc bấm để chọn</strong>
                                    <small data-upload-hint>PNG, JPG, SVG · tối đa 2MB</small>
                                </span>
                                <input type="file" id="imageFile" name="imageFile" accept="image/*" required>
                            </label>
                        </div>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/paymentMethod}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Thêm phương thức</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
