<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Sửa phương thức thanh toán')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('payments')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Thanh toán', '/admin/paymentMethod', 'Chỉnh sửa')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1 th:text="${method.nameMethod}">Sửa phương thức</h1>
                    <p th:text="'Mã #' + ${method.id} + ' · thay đổi có hiệu lực ngay'"></p>
                </div>
                <span th:replace="~{fragments/admin :: activeStatus(${method.status}, 'Đang hoạt động', 'Tạm dừng')}"></span>
            </div>

            <form th:action="@{'/admin/paymentMethod/edit/' + ${method.id}}" method="post" enctype="multipart/form-data" class="form-narrow" id="pmForm">
                <section class="panel">
                    <div class="panel-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label class="form-label" for="nameMethod">Tên phương thức<span class="req">*</span></label>
                                <div class="input-icon">
                                    <i class="bi bi-credit-card"></i>
                                    <input type="text" id="nameMethod" name="nameMethod" th:value="${method.nameMethod}"
                                           class="form-control" required maxlength="100">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="status">Trạng thái</label>
                                <select id="status" name="status" class="form-select" required th:data-original="${method.status}">
                                    <option value="1" th:selected="${method.status == 1}">Hoạt động</option>
                                    <option value="0" th:selected="${method.status == 0}">Tạm dừng</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">Logo</label>
                            <label class="upload-drop" data-upload data-max-mb="2">
                                <span class="upload-thumb">
                                    <img th:if="${method.imageUrl != null}" th:src="${method.imageUrl}" alt="Logo hiện tại" style="object-fit:contain;padding:6px">
                                    <i th:if="${method.imageUrl == null}" class="bi bi-image"></i>
                                </span>
                                <span class="upload-meta">
                                    <strong data-upload-name th:text="${method.imageUrl != null} ? 'Logo hiện tại' : 'Chưa có logo'">Logo</strong>
                                    <small data-upload-hint>Bấm để chọn logo mới (để trống nếu giữ nguyên) · tối đa 2MB</small>
                                </span>
                                <input type="file" id="imageFile" name="imageFile" accept="image/*">
                            </label>
                        </div>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/paymentMethod}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Cập nhật</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
<script>
    (function () {
        var form = document.getElementById('pmForm');
        var status = document.getElementById('status');
        form.addEventListener('submit', function (e) {
            if (status.dataset.original === '1' && status.value === '0' &&
                !confirm('Tạm dừng phương thức này? Khách sẽ không thể chọn khi thanh toán.')) {
                e.preventDefault();
            }
        });
    })();
</script>
</body>
</html>
