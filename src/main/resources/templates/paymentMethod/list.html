<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Phương thức thanh toán')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('payments')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Phương thức thanh toán')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Phương thức thanh toán</h1>
                    <p>Các lựa chọn thanh toán khách thấy khi đặt vé.</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/admin/paymentMethod/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm phương thức</a>
                </div>
            </div>

            <th:block th:if="${methods != null and !methods.empty}">
                <div class="toolbar">
                    <div class="seg" data-status-filter="[data-row]" role="group" aria-label="Lọc theo trạng thái">
                        <button type="button" class="active" data-value="">Tất cả</button>
                        <button type="button" data-value="1">Hoạt động</button>
                        <button type="button" data-value="0">Tạm dừng</button>
                    </div>
                    <div class="seg" data-view-toggle="card" role="group" aria-label="Chế độ xem">
                        <button type="button" data-view="card"><i class="bi bi-grid"></i>Thẻ</button>
                        <button type="button" data-view="table"><i class="bi bi-list-ul"></i>Bảng</button>
                    </div>
                </div>

                <div class="card-grid" data-view-panel="card">
                    <article class="item-card" th:each="m : ${methods}" data-row th:data-status="${m.status}">
                        <div class="cover short logo">
                            <img th:if="${m.imageUrl != null}" th:src="${m.imageUrl}" th:alt="${m.nameMethod}" loading="lazy">
                            <i th:if="${m.imageUrl == null}" class="bi bi-credit-card"></i>
                            <span th:replace="~{fragments/admin :: activeStatus(${m.status}, 'Hoạt động', 'Tạm dừng')}"></span>
                        </div>
                        <div class="body">
                            <h3 class="title" th:text="${m.nameMethod}">Phương thức</h3>
                            <div class="meta"><span th:text="'Mã #' + ${m.id}"></span></div>
                        </div>
                        <div class="foot">
                            <a th:href="@{'/admin/paymentMethod/edit/' + ${m.id}}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i>Sửa</a>
                            <div class="row-actions">
                                <form th:action="@{'/admin/paymentMethod/status/' + ${m.id}}" method="post"
                                      th:data-confirm="${m.status == 1} ? 'Tạm dừng phương thức này? Khách sẽ không chọn được khi thanh toán.' : 'Kích hoạt lại phương thức này?'">
                                    <button type="submit" class="btn btn-icon btn-sm" th:classappend="${m.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'"
                                            th:title="${m.status == 1} ? 'Tạm dừng' : 'Kích hoạt'">
                                        <i class="bi" th:classappend="${m.status == 1} ? 'bi-pause-fill' : 'bi-play-fill'"></i>
                                    </button>
                                </form>
                                <form th:action="@{'/admin/paymentMethod/delete/' + ${m.id}}" method="post"
                                      data-confirm="Xóa phương thức thanh toán này? Hành động không thể hoàn tác.">
                                    <button type="submit" class="btn btn-soft-danger btn-icon btn-sm" title="Xóa"><i class="bi bi-trash"></i></button>
                                </form>
                            </div>
                        </div>
                    </article>
                </div>

                <section class="panel" data-view-panel="table" hidden>
                    <div class="table-wrap">
                        <table class="table table-modern table-hover">
                            <thead>
                            <tr>
                                <th>Phương thức</th>
                                <th>Trạng thái</th>
                                <th class="actions-col">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="m : ${methods}" data-row th:data-status="${m.status}">
                                <td>
                                    <div class="cell-media">
                                        <img th:if="${m.imageUrl != null}" th:src="${m.imageUrl}" class="thumb logo" alt="" loading="lazy">
                                        <span th:if="${m.imageUrl == null}" class="thumb"><i class="bi bi-credit-card"></i></span>
                                        <div>
                                            <div class="title" th:text="${m.nameMethod}"></div>
                                            <div class="sub" th:text="'#' + ${m.id}"></div>
                                        </div>
                                    </div>
                                </td>
                                <td><span th:replace="~{fragments/admin :: activeStatus(${m.status}, 'Hoạt động', 'Tạm dừng')}"></span></td>
                                <td class="actions-col">
                                    <div class="row-actions">
                                        <a th:href="@{'/admin/paymentMethod/edit/' + ${m.id}}" class="btn btn-light btn-icon btn-sm" title="Sửa"><i class="bi bi-pencil"></i></a>
                                        <form th:action="@{'/admin/paymentMethod/status/' + ${m.id}}" method="post"
                                              th:data-confirm="${m.status == 1} ? 'Tạm dừng phương thức này? Khách sẽ không chọn được khi thanh toán.' : 'Kích hoạt lại phương thức này?'">
                                            <button type="submit" class="btn btn-icon btn-sm" th:classappend="${m.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'"
                                                    th:title="${m.status == 1} ? 'Tạm dừng' : 'Kích hoạt'">
                                                <i class="bi" th:classappend="${m.status == 1} ? 'bi-pause-fill' : 'bi-play-fill'"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{'/admin/paymentMethod/delete/' + ${m.id}}" method="post"
                                              data-confirm="Xóa phương thức thanh toán này? Hành động không thể hoàn tác.">
                                            <button type="submit" class="btn btn-soft-danger btn-icon btn-sm" title="Xóa"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </th:block>

            <section class="panel" th:if="${methods == null or methods.empty}">
                <div class="empty-state">
                    <div class="icon"><i class="bi bi-credit-card"></i></div>
                    <h5>Chưa có phương thức thanh toán</h5>
                    <p>Thêm VNPay, ví điện tử hoặc tiền mặt tại quầy.</p>
                    <a th:href="@{/admin/paymentMethod/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm phương thức</a>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
