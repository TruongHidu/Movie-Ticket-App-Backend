<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Thêm loại ghế')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('seattypes')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Loại ghế', '/admin/seat-types', 'Thêm mới')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Thêm loại ghế</h1>
                    <p>Mã loại ghế dùng làm khóa, không thể đổi sau khi tạo.</p>
                </div>
            </div>

            <form th:action="@{/admin/seat-types/add}" method="post" class="form-narrow">
                <section class="panel">
                    <div class="panel-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label for="idLoaiGhe" class="form-label">Mã<span class="req">*</span></label>
                                <input type="text" class="form-control" id="idLoaiGhe" name="idLoaiGhe" placeholder="VD: VIP" required>
                            </div>
                            <div class="col-md-5">
                                <label for="tenLoaiGhe" class="form-label">Tên loại ghế<span class="req">*</span></label>
                                <input type="text" class="form-control" id="tenLoaiGhe" name="tenLoaiGhe" placeholder="VD: Ghế VIP" required>
                            </div>
                            <div class="col-md-4">
                                <label for="donGia" class="form-label">Đơn giá<span class="req">*</span></label>
                                <div class="input-group">
                                    <input type="number" min="0" step="any" class="form-control" id="donGia" name="donGia" required>
                                    <span class="input-group-text">đ</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/seat-types}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Lưu</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
