<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm loại ghế</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1 class="mb-3">Thêm loại ghế</h1>

<form th:action="@{/admin/seat-types/add}" method="post">
    <div class="mb-3">
        <label for="idLoaiGhe" class="form-label">ID loại ghế</label>
        <input type="text" class="form-control" id="idLoaiGhe" name="idLoaiGhe" required>
    </div>
    <div class="mb-3">
        <label for="tenLoaiGhe" class="form-label">Tên loại ghế</label>
        <input type="text" class="form-control" id="tenLoaiGhe" name="tenLoaiGhe" required>
    </div>
    <div class="mb-3">
        <label for="donGia" class="form-label">Đơn giá</label>
        <input type="number" step="0.01" class="form-control" id="donGia" name="donGia" required>
    </div>
    <button type="submit" class="btn btn-success">Lưu</button>
    <a th:href="@{/admin/seat-types}" class="btn btn-secondary">Hủy</a>
</form>
</body>
</html>
