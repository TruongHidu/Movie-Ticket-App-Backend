<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Loại ghế')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('seattypes')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Loại ghế')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Loại ghế &amp; giá vé</h1>
                    <p>Đơn giá của từng loại ghế được dùng để tính tiền vé.</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/admin/seat-types/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm loại ghế</a>
                </div>
            </div>

            <div class="card-grid" th:if="${!seatTypes.isEmpty()}">
                <div class="tile-card" th:each="seat : ${seatTypes}">
                    <div class="tile-top">
                        <span class="tile-icon"><i class="bi bi-person-workspace"></i></span>
                        <span class="tag" th:text="${seat.idLoaiGhe}">GT</span>
                    </div>
                    <div>
                        <h3 class="tile-title" th:text="${seat.tenLoaiGhe}">Ghế thường</h3>
                        <div class="money fs-4 mt-1" th:text="${#numbers.formatDecimal(seat.donGia, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</div>
                        <div class="tile-sub">mỗi ghế</div>
                    </div>
                    <div class="tile-foot">
                        <a th:href="@{'/admin/seat-types/edit/' + ${seat.idLoaiGhe}}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i>Sửa</a>
                        <form th:action="@{'/admin/seat-types/delete/' + ${seat.idLoaiGhe}}" method="post"
                              data-confirm="Xóa loại ghế này? Các ghế đang dùng loại này có thể bị ảnh hưởng.">
                            <button type="submit" class="btn btn-soft-danger btn-sm"><i class="bi bi-trash"></i>Xóa</button>
                        </form>
                    </div>
                </div>
            </div>

            <section class="panel" th:if="${seatTypes.isEmpty()}">
                <div class="empty-state">
                    <div class="icon"><i class="bi bi-grid-3x3-gap"></i></div>
                    <h5>Chưa có loại ghế</h5>
                    <p>Thêm loại ghế (thường, VIP, đôi…) và đơn giá tương ứng.</p>
                    <a th:href="@{/admin/seat-types/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm loại ghế</a>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
