<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý loại ghế</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1 class="mb-3">Danh sách loại ghế</h1>

<a th:href="@{/admin/seat-types/add}" class="btn btn-success mb-3">Thêm loại ghế</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Tên loại ghế</th>
        <th>Đơn giá</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="seat : ${seatTypes}">
        <td th:text="${seat.idLoaiGhe}"></td>
        <td th:text="${seat.tenLoaiGhe}"></td>
        <td th:text="${seat.donGia}"></td>
        <td>
            <a th:href="@{'/admin/seat-types/edit/' + ${seat.idLoaiGhe}}" class="btn btn-primary btn-sm">Sửa</a>
            <form th:action="@{'/admin/seat-types/delete/' + ${seat.idLoaiGhe}}" method="post" style="display:inline">
                <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
