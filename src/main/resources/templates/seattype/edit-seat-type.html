<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa loại ghế</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1 class="mb-3">Sửa loại ghế</h1>

<form th:action="@{'/admin/seat-types/edit/' + ${seatType.idLoaiGhe}}" method="post" th:object="${seatType}">
    <div class="mb-3">
        <label class="form-label">ID loại ghế</label>
        <input type="text" class="form-control" th:field="*{idLoaiGhe}" readonly>
    </div>
    <div class="mb-3">
        <label class="form-label">Tên loại ghế</label>
        <input type="text" class="form-control" th:field="*{tenLoaiGhe}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Đơn giá</label>
        <input type="number" step="0.01" class="form-control" th:field="*{donGia}" required>
    </div>
    <button type="submit" class="btn btn-primary">Cập nhật</button>
    <a th:href="@{/admin/seat-types}" class="btn btn-secondary">Hủy</a>
</form>
</body>
</html>
