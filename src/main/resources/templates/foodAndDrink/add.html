<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Thêm combo')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('food')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Combo bắp nước', '/admin/food-drink', 'Thêm mới')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Thêm combo</h1>
                    <p>Đồ ăn &amp; thức uống khách có thể đặt kèm vé.</p>
                </div>
            </div>

            <form th:action="@{/admin/food-drink/add}" method="post" enctype="multipart/form-data" class="form-narrow">
                <section class="panel">
                    <div class="panel-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label class="form-label" for="nameCombo">Tên combo<span class="req">*</span></label>
                                <input type="text" id="nameCombo" name="nameCombo" class="form-control" placeholder="VD: Combo 1 bắp + 2 nước" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="price">Giá<span class="req">*</span></label>
                                <div class="input-group">
                                    <input type="number" min="0" step="any" id="price" name="price" class="form-control" required>
                                    <span class="input-group-text">đ</span>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="descript">Mô tả<span class="req">*</span></label>
                            <input type="text" id="descript" name="descript" class="form-control" placeholder="1 bắp lớn vị caramel, 2 nước ngọt size L" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Ảnh combo<span class="req">*</span></label>
                                <label class="upload-drop" data-upload data-max-mb="10">
                                    <span class="upload-thumb"><i class="bi bi-image"></i></span>
                                    <span class="upload-meta">
                                        <strong data-upload-name>Chọn ảnh</strong>
                                        <small data-upload-hint>Kéo thả hoặc bấm để chọn</small>
                                    </span>
                                    <input type="file" name="imageFile" accept="image/*" required>
                                </label>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="status">Trạng thái</label>
                                <select id="status" name="status" class="form-select">
                                    <option value="1">Đang bán</option>
                                    <option value="0">Tạm ẩn</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/food-drink}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Thêm combo</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
