<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Combo Mới</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2 class="text-center mb-4">➕ Thêm Combo Đồ ăn & Thức uống</h2>

<form th:action="@{/admin/food-drink/add}" method="post" enctype="multipart/form-data" class="w-50 mx-auto">

    <div class="mb-3">
        <label class="form-label">Tên Combo</label>
        <input type="text" name="nameCombo" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <input type="text" name="descript" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Số lượng</label>
        <input type="number" name="quantity" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Giá</label>
        <input type="number" name="price" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Trạng thái</label>
        <select name="status" class="form-select">
            <option value="1">Hoạt động</option>
            <option value="0">Tạm ẩn</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Ảnh Combo</label>
        <input type="file" name="imageFile" class="form-control" accept="image/*" required>
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-success">Thêm Combo</button>
        <a href="/admin/food-drink" class="btn btn-secondary">Quay lại</a>
    </div>
</form>
</body>
</html>
