<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa Combo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2 class="text-center mb-4">✏️ Chỉnh sửa Combo</h2>

<form th:action="@{'/admin/food-drink/edit/' + ${combo.id}}" method="post" enctype="multipart/form-data" class="w-50 mx-auto">

    <div class="mb-3">
        <label class="form-label">Tên Combo</label>
        <input type="text" name="nameCombo" class="form-control" th:value="${combo.nameCombo}" required>
    </div>


    <div class="mb-3">
        <label class="form-label">Tên Combo</label>
        <input type="text" name="descript" class="form-control" th:value="${combo.descript}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Giá</label>
        <input type="number" name="price" class="form-control" th:value="${combo.price}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Trạng thái</label>
        <select name="status" class="form-select">
            <option value="1" th:selected="${combo.status == 1}">Hoạt động</option>
            <option value="0" th:selected="${combo.status == 0}">Tạm ẩn</option>
        </select>
    </div>

    <div class="mb-3 text-center">
        <label class="form-label">Ảnh hiện tại</label><br>
        <img th:if="${combo.imageUrl}" th:src="${combo.imageUrl}" alt="Ảnh combo" style="width: 150px; height: 150px; object-fit: cover;">
    </div>

    <div class="mb-3">
        <label class="form-label">Chọn ảnh mới (nếu muốn đổi)</label>
        <input type="file" name="imageFile" class="form-control" accept="image/*">
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <a href="/admin/food-drink" class="btn btn-secondary">Hủy</a>
    </div>
</form>
</body>
</html>
