<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Combo bắp nước')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('food')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Combo bắp nước')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Combo bắp nước</h1>
                    <p><span th:text="${combos.size()}">0</span> combo đồ ăn &amp; thức uống</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/admin/food-drink/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm combo</a>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="seg" data-status-filter="[data-row]" role="group" aria-label="Lọc theo trạng thái">
                        <button type="button" class="active" data-value="">Tất cả</button>
                        <button type="button" data-value="1">Đang bán</button>
                        <button type="button" data-value="0">Tạm ẩn</button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="search" class="form-control" placeholder="Tìm combo…" data-search-target="[data-row]" aria-label="Tìm combo">
                    </div>
                </div>
            </div>

            <div class="card-grid" th:if="${!combos.isEmpty()}">
                <article class="item-card" th:each="combo : ${combos}" data-row th:data-status="${combo.status}">
                    <div class="cover short">
                        <img th:if="${combo.imageUrl}" th:src="${combo.imageUrl}" th:alt="${combo.nameCombo}" loading="lazy">
                        <i th:unless="${combo.imageUrl}" class="bi bi-cup-straw"></i>
                        <span th:replace="~{fragments/admin :: activeStatus(${combo.status}, 'Đang bán', 'Tạm ẩn')}"></span>
                    </div>
                    <div class="body">
                        <h3 class="title" th:text="${combo.nameCombo}">Combo</h3>
                        <p class="desc mb-0" th:text="${combo.descript}"></p>
                        <div class="money fs-5 mt-auto pt-1" th:text="${#numbers.formatDecimal(combo.price, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</div>
                    </div>
                    <div class="foot">
                        <a th:href="@{'/admin/food-drink/edit/' + ${combo.id}}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i>Sửa</a>
                        <form th:action="@{'/admin/food-drink/status/' + ${combo.id}}" method="post">
                            <button type="submit" class="btn btn-sm" th:classappend="${combo.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'">
                                <th:block th:if="${combo.status == 1}"><i class="bi bi-eye-slash"></i>Tạm ẩn</th:block>
                                <th:block th:if="${combo.status != 1}"><i class="bi bi-eye"></i>Mở bán</th:block>
                            </button>
                        </form>
                    </div>
                </article>
            </div>

            <section class="panel" th:if="${combos.isEmpty()}">
                <div class="empty-state">
                    <div class="icon"><i class="bi bi-cup-straw"></i></div>
                    <h5>Chưa có combo nào</h5>
                    <p>Thêm combo bắp nước để khách có thể đặt kèm vé.</p>
                    <a th:href="@{/admin/food-drink/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm combo</a>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
