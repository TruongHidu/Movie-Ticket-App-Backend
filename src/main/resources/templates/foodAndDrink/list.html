<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách Combo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h2>Danh sách Combo Đồ Ăn & Thức Uống</h2>
<a href="/admin/food-drink/add" class="btn btn-success mb-3">+ Thêm Combo</a>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên Combo</th>
        <th>Mô tả</th>
        <th>Ảnh</th>
        <th>Giá</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="combo : ${combos}">
        <td th:text="${combo.id}"></td>
        <td th:text="${combo.nameCombo}"></td>
        <td th:text="${combo.descript}"></td>
        <td><img th:src="${combo.imageUrl}" alt="image" width="80"></td>
        <td th:text="${combo.price}"></td>
        <td>
            <span th:text="${combo.status == 1 ? 'Hoạt động' : 'Ẩn'}"
                  th:classappend="${combo.status == 1 ? 'text-success' : 'text-danger'}"></span>
        </td>
        <td>
            <a th:href="@{'/admin/food-drink/edit/' + ${combo.id}}" class="btn btn-primary btn-sm">Sửa</a>
            <form th:action="@{'/admin/food-drink/status/' + ${combo.id}}" method="post" style="display:inline-block">
                <button type="submit" class="btn btn-warning btn-sm">Đổi trạng thái</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
