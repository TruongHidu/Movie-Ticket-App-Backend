<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4e73df;
            --secondary: #6f42c1;
            --dark: #5a5c69;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease;
        }

        .login-header {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .login-header h2 {
            font-weight: 700;
            color: var(--dark);
            margin-top: 10px;
            margin-bottom: 0;
        }

        .login-icon {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-body {
            padding: 2.5rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1.25rem;
            border: 1px solid #e3e6f0;
            background-color: #f8f9fc;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
            border-color: var(--primary);
            background-color: #fff;
        }

        .input-group-text {
            border-radius: 10px 0 0 10px;
            border: 1px solid #e3e6f0;
            background-color: #f8f9fc;
            color: var(--dark);
        }

        .form-control {
            border-radius: 0 10px 10px 0;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: white;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.4);
            color: white;
        }

        .alert-danger {
            border-radius: 10px;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-shield-lock login-icon"></i>
            <h2>Quản Trị Viên</h2>
            <p class="text-muted mb-0 mt-2">Đăng nhập vào hệ thống</p>
        </div>
        <div class="login-body">
            
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div th:text="${error}"></div>
            </div>

            <form action="/login-admin" method="post">
                <div class="mb-4">
                    <label class="form-label text-muted fw-semibold mb-1">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" name="email" placeholder="Nhập email quản trị..." required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted fw-semibold mb-1">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" name="password" placeholder="Nhập mật khẩu..." required>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i> ĐĂNG NHẬP
                </button>
            </form>
        </div>
    </div>

</body>
</html>
