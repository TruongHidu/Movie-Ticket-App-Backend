<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Quản lý phim')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('movies')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Phim')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Quản lý phim</h1>
                    <p><span th:text="${movies.size()}">0</span> phim trong danh sách</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/admin/movies/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm phim mới</a>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="seg" role="group" aria-label="Lọc theo trạng thái">
                        <a th:href="@{/admin/movies}" th:classappend="${currentStatus == null} ? 'active'">Tất cả</a>
                        <a th:href="@{/admin/movies(status=1)}" th:classappend="${currentStatus == 1} ? 'active'">Hoạt động</a>
                        <a th:href="@{/admin/movies(status=0)}" th:classappend="${currentStatus == 0} ? 'active'">Đã khóa</a>
                    </div>
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="search" class="form-control" placeholder="Tìm phim, đạo diễn…"
                               data-search-target="[data-search-item]" aria-label="Tìm phim">
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="seg" data-view-toggle="card" role="group" aria-label="Chế độ xem">
                        <button type="button" data-view="card" title="Dạng thẻ"><i class="bi bi-grid"></i>Thẻ</button>
                        <button type="button" data-view="table" title="Dạng bảng"><i class="bi bi-list-ul"></i>Bảng</button>
                    </div>
                </div>
            </div>

            <th:block th:if="${!movies.isEmpty()}">
                <!-- Dạng thẻ -->
                <div class="card-grid" data-view-panel="card">
                    <article class="item-card" th:each="movie : ${movies}" data-search-item>
                        <div class="cover">
                            <img th:if="${movie.poster}" th:src="${movie.poster}" th:alt="${movie.tenPhim}" loading="lazy">
                            <i th:unless="${movie.poster}" class="bi bi-film"></i>
                            <span th:replace="~{fragments/admin :: activeStatus(${movie.status}, 'Hoạt động', 'Đã khóa')}"></span>
                        </div>
                        <div class="body">
                            <h3 class="title" th:text="${movie.tenPhim}">Tên phim</h3>
                            <div class="meta">
                                <span><i class="bi bi-clock"></i><span th:text="${movie.thoiLuong} + ' phút'"></span></span>
                                <span th:if="${movie.namPhatHanh}"><i class="bi bi-calendar3"></i><span th:text="${#temporals.format(movie.namPhatHanh, 'dd/MM/yyyy')}"></span></span>
                            </div>
                            <div class="meta" th:if="${movie.theloai}"><span><i class="bi bi-tag"></i><span th:text="${movie.theloai}"></span></span></div>
                            <div class="meta" th:if="${movie.daoDien}"><span><i class="bi bi-person-video2"></i><span th:text="${movie.daoDien}"></span></span></div>
                            <p class="desc mb-0" th:text="${movie.descrip}"></p>
                        </div>
                        <div class="foot">
                            <a th:href="@{'/admin/movies/edit/' + ${movie.idPhim}}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i>Sửa</a>
                            <form th:action="@{'/admin/movies/status/' + ${movie.idPhim}}" method="post"
                                  th:data-confirm="${movie.status == 1} ? 'Khóa phim này? Phim sẽ không hiển thị cho khách hàng.' : 'Mở lại phim này?'">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${movie.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'">
                                    <th:block th:if="${movie.status == 1}"><i class="bi bi-lock"></i>Khóa</th:block>
                                    <th:block th:if="${movie.status != 1}"><i class="bi bi-unlock"></i>Mở khóa</th:block>
                                </button>
                            </form>
                        </div>
                    </article>
                </div>

                <!-- Dạng bảng -->
                <section class="panel" data-view-panel="table" hidden>
                    <div class="table-wrap">
                        <table class="table table-modern table-hover">
                            <thead>
                            <tr>
                                <th>Phim</th>
                                <th>Thể loại</th>
                                <th>Thời lượng</th>
                                <th>Đạo diễn</th>
                                <th>Khởi chiếu</th>
                                <th>Trạng thái</th>
                                <th class="actions-col">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="movie : ${movies}" data-search-item>
                                <td>
                                    <div class="cell-media">
                                        <img th:if="${movie.poster}" th:src="${movie.poster}" class="thumb poster" alt="" loading="lazy">
                                        <span th:unless="${movie.poster}" class="thumb poster"><i class="bi bi-film"></i></span>
                                        <div>
                                            <div class="title" th:text="${movie.tenPhim}"></div>
                                            <div class="sub" th:text="'#' + ${movie.idPhim}"></div>
                                        </div>
                                    </div>
                                </td>
                                <td><div class="truncate" style="max-width:180px" th:text="${movie.theloai}"></div></td>
                                <td class="text-nowrap" th:text="${movie.thoiLuong} + ' phút'"></td>
                                <td th:text="${movie.daoDien}"></td>
                                <td class="text-nowrap" th:text="${#temporals.format(movie.namPhatHanh, 'dd/MM/yyyy')}"></td>
                                <td><span th:replace="~{fragments/admin :: activeStatus(${movie.status}, 'Hoạt động', 'Đã khóa')}"></span></td>
                                <td class="actions-col">
                                    <div class="row-actions">
                                        <a th:href="@{'/admin/movies/edit/' + ${movie.idPhim}}" class="btn btn-light btn-icon btn-sm" title="Sửa"><i class="bi bi-pencil"></i></a>
                                        <form th:action="@{'/admin/movies/status/' + ${movie.idPhim}}" method="post"
                                              th:data-confirm="${movie.status == 1} ? 'Khóa phim này? Phim sẽ không hiển thị cho khách hàng.' : 'Mở lại phim này?'">
                                            <button type="submit" class="btn btn-icon btn-sm"
                                                    th:classappend="${movie.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'"
                                                    th:title="${movie.status == 1} ? 'Khóa' : 'Mở khóa'">
                                                <i class="bi" th:classappend="${movie.status == 1} ? 'bi-lock' : 'bi-unlock'"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </th:block>

            <section class="panel" th:if="${movies.isEmpty()}">
                <div class="empty-state">
                    <div class="icon"><i class="bi bi-film"></i></div>
                    <h5>Chưa có phim nào</h5>
                    <p>Thêm phim đầu tiên để bắt đầu lên lịch chiếu.</p>
                    <a th:href="@{/admin/movies/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm phim</a>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
