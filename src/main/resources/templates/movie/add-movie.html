<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Thêm phim')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('movies')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Phim', '/admin/movies', 'Thêm phim')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Thêm phim mới</h1>
                    <p>Phim mới tạo cần được mở khóa để hiển thị cho khách hàng.</p>
                </div>
            </div>

            <form th:action="@{/admin/movies/add}" th:object="${movie}" method="post" enctype="multipart/form-data">
                <div class="row g-4">
                    <div class="col-lg-8">
                        <section class="panel">
                            <div class="panel-head"><h2 class="panel-title">Thông tin phim</h2></div>
                            <div class="panel-body">
                                <div class="mb-3">
                                    <label class="form-label" for="tenPhim">Tên phim<span class="req">*</span></label>
                                    <input type="text" id="tenPhim" th:field="*{tenPhim}" class="form-control" placeholder="VD: Lật Mặt 8" required>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="theloai">Thể loại<span class="req">*</span></label>
                                        <input type="text" id="theloai" th:field="*{theloai}" class="form-control" placeholder="Hành động, Hài…" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label" for="thoiLuong">Thời lượng<span class="req">*</span></label>
                                        <div class="input-group">
                                            <input type="number" min="1" id="thoiLuong" th:field="*{thoiLuong}" class="form-control" required>
                                            <span class="input-group-text">phút</span>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label" for="namPhatHanh">Khởi chiếu</label>
                                        <input type="date" id="namPhatHanh" th:field="*{namPhatHanh}" class="form-control">
                                    </div>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="daoDien">Đạo diễn</label>
                                        <input type="text" id="daoDien" th:field="*{daoDien}" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="dienVien">Diễn viên</label>
                                        <input type="text" id="dienVien" th:field="*{dienVien}" class="form-control" placeholder="Phân cách bằng dấu phẩy">
                                    </div>
                                </div>
                                <div>
                                    <label class="form-label" for="descrip">Mô tả</label>
                                    <textarea id="descrip" th:field="*{descrip}" class="form-control" rows="5" placeholder="Tóm tắt nội dung phim…"></textarea>
                                </div>
                            </div>
                        </section>
                    </div>

                    <div class="col-lg-4">
                        <section class="panel">
                            <div class="panel-head"><h2 class="panel-title">Poster</h2></div>
                            <div class="panel-body">
                                <label class="upload-drop" data-upload data-max-mb="10">
                                    <span class="upload-thumb tall"><i class="bi bi-image"></i></span>
                                    <span class="upload-meta">
                                        <strong data-upload-name>Chọn ảnh poster</strong>
                                        <small data-upload-hint>Kéo thả hoặc bấm để chọn · tỉ lệ 2:3</small>
                                    </span>
                                    <input type="file" name="posterFile" accept="image/*">
                                </label>
                            </div>
                        </section>
                    </div>
                </div>

                <div class="d-flex gap-2 justify-content-end mt-4">
                    <a th:href="@{/admin/movies}" class="btn btn-light">Hủy</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Lưu phim</button>
                </div>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
