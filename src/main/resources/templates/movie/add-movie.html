<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm phim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2>Thêm phim mới</h2>
<form th:action="@{/admin/movies/add}" th:object="${movie}" method="post" enctype="multipart/form-data">
    <div class="mb-3">
        <label>Tên phim</label>
        <input type="text" th:field="*{tenPhim}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Thể loại</label>
        <input type="text" th:field="*{theloai}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Thời lượng (phút)</label>
        <input type="number" th:field="*{thoiLuong}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Đạo diễn</label>
        <input type="text" th:field="*{daoDien}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Ngày phát hành</label>
        <input type="date" th:field="*{namPhatHanh}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Poster</label>
        <input type="file" name="posterFile" class="form-control">
    </div>
    <div class="mb-3">
        <label>Diễn viên</label>
        <input type="text" th:field="*{dienVien}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Mô tả</label>
        <textarea th:field="*{descrip}" class="form-control"></textarea>
    </div>
    <button type="submit" class="btn btn-success">Lưu</button>
    <a href="/admin/movies" class="btn btn-secondary">Quay lại</a>
</form>
</body>
</html>
