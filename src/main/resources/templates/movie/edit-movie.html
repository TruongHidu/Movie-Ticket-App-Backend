<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa phim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2>Sửa thông tin phim</h2>
<form th:action="@{'/admin/movies/edit/' + ${movie.idPhim}}" th:object="${movie}" method="post" enctype="multipart/form-data">
    <div class="mb-3">
        <label>Tên phim</label>
        <input type="text" th:field="*{tenPhim}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Thể loại</label>
        <input type="text" th:field="*{theloai}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Thời lượng (phút)</label>
        <input type="number" th:field="*{thoiLuong}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Đạo diễn</label>
        <input type="text" th:field="*{daoDien}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Ngày phát hành</label>
        <input type="date" th:field="*{namPhatHanh}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Poster hiện tại</label>
        <div th:if="${movie.poster}">
            <img th:src="${movie.poster}" width="150"/>
        </div>
        <div th:if="${movie.poster == null}">Chưa có poster</div>
        <label>Đổi poster</label>
        <input type="file" name="posterFile" class="form-control">
    </div>
    <div class="mb-3">
        <label>Diễn viên</label>
        <input type="text" th:field="*{dienVien}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Mô tả</label>
        <textarea th:field="*{descrip}" class="form-control"></textarea>
    </div>
    <div class="mb-3">
        <label>Trạng thái</label>
        <select th:field="*{status}" class="form-control">
            <option value="1" th:selected="${movie.status == 1}">Hoạt động</option>
            <option value="0" th:selected="${movie.status == 0}">Khóa</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
    <a href="/admin/movies" class="btn btn-secondary">Quay lại</a>
</form>
</body>
</html>
