<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách khuyến mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4 text-center">📢 Danh sách khuyến mãi</h2>

    <div class="text-end mb-3">
        <a href="/admin/promotions/add" class="btn btn-success">+ Thêm khuyến mãi</a>
    </div>

    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tiêu đề</th>
            <th>Mô tả</th>
            <th>Hình ảnh</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="promo : ${promotions}">
            <td th:text="${promo.id}"></td>
            <td th:text="${promo.title}"></td>
            <td th:text="${promo.description}"></td>
            <td>
                <img th:src="${promo.imageUrl}" alt="image" class="img-thumbnail" style="width: 100px;">
            </td>
            <td>
                <span th:text="${promo.status == 1 ? 'Hoạt động' : 'Ẩn'}"
                      th:classappend="${promo.status == 1 ? 'text-success' : 'text-danger'}"></span>
            </td>
            <td>
                <a th:href="@{'/admin/promotions/edit/' + ${promo.id}}" class="btn btn-primary btn-sm">Sửa</a>
                <a th:href="@{'/admin/promotions/delete/' + ${promo.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Bạn có chắc muốn xóa khuyến mãi này?')">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
