<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Khuyến mãi')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('promotions')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Khuyến mãi')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Khuyến mãi</h1>
                    <p><span th:text="${promotions.size()}">0</span> chương trình</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/admin/promotions/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm khuyến mãi</a>
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="seg" data-status-filter="[data-row]" role="group" aria-label="Lọc theo trạng thái">
                        <button type="button" class="active" data-value="">Tất cả</button>
                        <button type="button" data-value="1">Hoạt động</button>
                        <button type="button" data-value="0">Ẩn</button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="search" class="form-control" placeholder="Tìm khuyến mãi…" data-search-target="[data-row]" aria-label="Tìm khuyến mãi">
                    </div>
                </div>
            </div>

            <section class="panel">
                <div class="table-wrap" th:if="${!promotions.isEmpty()}">
                    <table class="table table-modern table-hover">
                        <thead>
                        <tr>
                            <th>Chương trình</th>
                            <th>Mô tả</th>
                            <th>Trạng thái</th>
                            <th class="actions-col">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="promo : ${promotions}" data-row th:data-status="${promo.status}">
                            <td>
                                <div class="cell-media">
                                    <img th:if="${promo.imageUrl}" th:src="${promo.imageUrl}" class="thumb" alt="" loading="lazy">
                                    <span th:unless="${promo.imageUrl}" class="thumb"><i class="bi bi-gift"></i></span>
                                    <div>
                                        <div class="title" th:text="${promo.title}"></div>
                                        <div class="sub" th:text="'#' + ${promo.id}"></div>
                                    </div>
                                </div>
                            </td>
                            <td><div class="truncate text-muted" style="max-width:380px" th:text="${promo.description}" th:title="${promo.description}"></div></td>
                            <td><span th:replace="~{fragments/admin :: activeStatus(${promo.status}, 'Hoạt động', 'Ẩn')}"></span></td>
                            <td class="actions-col">
                                <div class="row-actions">
                                    <a th:href="@{'/admin/promotions/edit/' + ${promo.id}}" class="btn btn-light btn-icon btn-sm" title="Sửa"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{'/admin/promotions/delete/' + ${promo.id}}" class="btn btn-soft-danger btn-icon btn-sm" title="Xóa"
                                       data-confirm="Xóa khuyến mãi này? Hành động không thể hoàn tác."><i class="bi bi-trash"></i></a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="empty-state" th:if="${promotions.isEmpty()}">
                    <div class="icon"><i class="bi bi-gift"></i></div>
                    <h5>Chưa có khuyến mãi</h5>
                    <p>Tạo chương trình khuyến mãi để thu hút khách hàng.</p>
                    <a th:href="@{/admin/promotions/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm khuyến mãi</a>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
