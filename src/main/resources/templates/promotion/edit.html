<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa khuyến mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">✏️ Chỉnh sửa khuyến mãi</h2>

    <form th:action="@{'/admin/promotions/edit/' + ${promotion.id}}" th:object="${promotion}"
          method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="title" class="form-label">Tiêu đề</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Hình ảnh hiện tại</label><br>
            <img th:src="${promotion.imageUrl}" alt="image" class="img-thumbnail mb-3" style="width: 120px;">
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Chọn hình ảnh mới (nếu có)</label>
            <input type="file" id="image" name="image" class="form-control" accept="image/*">
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Trạng thái</label>
            <select id="status" th:field="*{status}" class="form-select">
                <option value="1">Hoạt động</option>
                <option value="0">Ẩn</option>
            </select>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">Cập nhật</button>
            <a href="/admin/promotions" class="btn btn-secondary px-4">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
