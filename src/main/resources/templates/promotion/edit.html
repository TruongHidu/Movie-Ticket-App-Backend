<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Sửa khuyến mãi')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('promotions')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Khuyến mãi', '/admin/promotions', 'Chỉnh sửa')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Chỉnh sửa khuyến mãi</h1>
                    <p th:text="'Mã khuyến mãi #' + ${promotion.id}"></p>
                </div>
            </div>

            <form th:action="@{'/admin/promotions/edit/' + ${promotion.id}}" th:object="${promotion}"
                  method="post" enctype="multipart/form-data" class="form-narrow">
                <input type="hidden" th:field="*{id}"/>
                <section class="panel">
                    <div class="panel-body">
                        <div class="mb-3">
                            <label for="title" class="form-label">Tiêu đề<span class="req">*</span></label>
                            <input type="text" id="title" th:field="*{title}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả<span class="req">*</span></label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="5" required></textarea>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Hình ảnh</label>
                                <label class="upload-drop" data-upload data-max-mb="10">
                                    <span class="upload-thumb">
                                        <img th:if="${promotion.imageUrl}" th:src="${promotion.imageUrl}" alt="Ảnh hiện tại">
                                        <i th:unless="${promotion.imageUrl}" class="bi bi-image"></i>
                                    </span>
                                    <span class="upload-meta">
                                        <strong data-upload-name>Ảnh hiện tại</strong>
                                        <small data-upload-hint>Bấm để chọn ảnh mới (để trống nếu giữ nguyên)</small>
                                    </span>
                                    <input type="file" id="image" name="image" accept="image/*">
                                </label>
                            </div>
                            <div class="col-md-4">
                                <label for="status" class="form-label">Trạng thái</label>
                                <select id="status" th:field="*{status}" class="form-select">
                                    <option value="1">Hoạt động</option>
                                    <option value="0">Ẩn</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/promotions}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Cập nhật</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
