<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Thêm khuyến mãi')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('promotions')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Khuyến mãi', '/admin/promotions', 'Thêm mới')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Thêm khuyến mãi</h1>
                    <p>Chương trình sẽ hiển thị trong mục khuyến mãi của ứng dụng.</p>
                </div>
            </div>

            <form th:action="@{/admin/promotions/add}" th:object="${promotion}" method="post" enctype="multipart/form-data" class="form-narrow">
                <section class="panel">
                    <div class="panel-body">
                        <div class="mb-3">
                            <label for="title" class="form-label">Tiêu đề<span class="req">*</span></label>
                            <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="VD: Thứ 4 vui vẻ — đồng giá 50.000đ" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả<span class="req">*</span></label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="5" placeholder="Điều kiện, thời gian áp dụng…" required></textarea>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">Hình ảnh<span class="req">*</span></label>
                                <label class="upload-drop" data-upload data-max-mb="10">
                                    <span class="upload-thumb"><i class="bi bi-image"></i></span>
                                    <span class="upload-meta">
                                        <strong data-upload-name>Chọn ảnh khuyến mãi</strong>
                                        <small data-upload-hint>Kéo thả hoặc bấm để chọn</small>
                                    </span>
                                    <input type="file" id="image" name="image" accept="image/*" required>
                                </label>
                            </div>
                            <div class="col-md-4">
                                <label for="status" class="form-label">Trạng thái</label>
                                <select id="status" th:field="*{status}" class="form-select">
                                    <option value="1">Hoạt động</option>
                                    <option value="0">Ẩn</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/promotions}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Lưu khuyến mãi</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
