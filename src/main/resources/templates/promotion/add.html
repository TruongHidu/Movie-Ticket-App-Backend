<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm khuyến mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">🆕 Thêm khuyến mãi mới</h2>

    <form th:action="@{/admin/promotions/add}" th:object="${promotion}" method="post" enctype="multipart/form-data"
          class="card p-4 shadow-sm">

        <div class="mb-3">
            <label for="title" class="form-label">Tiêu đề</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Nhập tiêu đề" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4" placeholder="Nhập mô tả" required></textarea>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Hình ảnh</label>
            <input type="file" id="image" name="image" class="form-control" accept="image/*" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Trạng thái</label>
            <select id="status" th:field="*{status}" class="form-select">
                <option value="1">Hoạt động</option>
                <option value="0">Ẩn</option>
            </select>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-success px-4">Lưu</button>
            <a href="/admin/promotions" class="btn btn-secondary px-4">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
