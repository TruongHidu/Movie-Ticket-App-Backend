<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Chi tiết hóa đơn')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('invoices')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Hóa đơn', '/admin/invoices', 'Hóa đơn #' + ${invoice.id})}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Hóa đơn <span th:text="'#' + ${invoice.id}"></span></h1>
                    <p th:text="'Tạo lúc ' + ${#temporals.format(invoice.createdAt, 'HH:mm, dd/MM/yyyy')}"></p>
                </div>
                <div class="page-actions">
                    <span th:replace="~{fragments/admin :: invoiceStatus(${invoice.status})}"></span>
                    <button type="button" class="btn btn-light" onclick="window.print()"><i class="bi bi-printer"></i>In</button>
                    <a th:href="@{/admin/invoices}" class="btn btn-light"><i class="bi bi-arrow-left"></i>Quay lại</a>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <section class="panel">
                        <div class="panel-head"><h2 class="panel-title"><i class="bi bi-ticket-perforated"></i>Thông tin vé</h2></div>
                        <div class="panel-body">
                            <dl class="dl-grid">
                                <dt>Phim</dt>
                                <dd class="fw-600" th:text="${invoice.movieName}"></dd>
                                <dt>Phòng chiếu</dt>
                                <dd th:text="${invoice.roomName}"></dd>
                                <dt>Suất chiếu</dt>
                                <dd>
                                    <span th:text="${#temporals.format(invoice.showTime, 'HH:mm')}"></span>
                                    <span class="text-muted" th:text="' · ' + ${#temporals.format(invoice.showDate, 'dd/MM/yyyy')}"></span>
                                </dd>
                                <dt>Ghế</dt>
                                <dd><span class="tag" th:each="seat : ${#strings.arraySplit(invoice.seatCodes, ',')}" th:text="${#strings.trim(seat)}"></span></dd>
                                <th:block th:if="${invoice.foodDrinks != null && !invoice.foodDrinks.isEmpty()}">
                                    <dt>Bắp nước</dt>
                                    <dd th:text="${invoice.foodDrinks}"></dd>
                                </th:block>
                                <th:block th:if="${invoice.user != null}">
                                    <dt>Khách hàng</dt>
                                    <dd>
                                        <span class="fw-600" th:text="${invoice.user.name}"></span>
                                        <span class="text-muted" th:text="' · ' + ${invoice.user.email}"></span>
                                    </dd>
                                </th:block>
                            </dl>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-head"><h2 class="panel-title"><i class="bi bi-credit-card"></i>Thanh toán</h2></div>
                        <div class="panel-body">
                            <dl class="dl-grid">
                                <dt>Phương thức</dt>
                                <dd>
                                    <span th:if="${paymentMethodName != null}" th:text="${paymentMethodName}"></span>
                                    <span th:if="${paymentMethodName == null}" class="text-muted">—</span>
                                </dd>
                                <th:block th:if="${invoice.transactionNo != null}">
                                    <dt>Mã giao dịch</dt>
                                    <dd><code th:text="${invoice.transactionNo}"></code></dd>
                                </th:block>
                                <th:block th:if="${invoice.paymentTime != null}">
                                    <dt>Thời gian thanh toán</dt>
                                    <dd th:text="${#temporals.format(invoice.paymentTime, 'dd/MM/yyyy HH:mm:ss')}"></dd>
                                </th:block>
                                <th:block th:if="${invoice.usedPoint > 0}">
                                    <dt>Điểm đã dùng</dt>
                                    <dd th:text="${invoice.usedPoint} + ' điểm'"></dd>
                                </th:block>
                                <th:block th:if="${invoice.bonusPoint > 0}">
                                    <dt>Điểm thưởng</dt>
                                    <dd class="text-success fw-600" th:text="'+' + ${invoice.bonusPoint} + ' điểm'"></dd>
                                </th:block>
                            </dl>
                        </div>
                    </section>
                </div>

                <div class="col-lg-4">
                    <div class="stat hero">
                        <div class="stat-label"><i class="bi bi-cash-stack"></i>Tổng thanh toán</div>
                        <div class="stat-value">
                            <span th:text="${invoice.totalPrice != null ? #numbers.formatDecimal(invoice.totalPrice, 0, 'POINT', 0, 'COMMA') : '0'}">0</span><small>đ</small>
                        </div>
                    </div>

                    <section class="panel mt-4" th:if="${invoice.barcodeUrl != null}">
                        <div class="panel-head"><h2 class="panel-title"><i class="bi bi-upc-scan"></i>Mã vé</h2></div>
                        <div class="panel-body text-center">
                            <img th:src="${invoice.barcodeUrl}" alt="Mã vạch vé" class="img-fluid" style="max-height:200px">
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
