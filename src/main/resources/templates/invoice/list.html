<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4e73df;
            --secondary: #6f42c1;
            --success: #1cc88a;
            --info: #36b9cc;
            --warning: #f6c23e;
            --danger: #e74a3b;
            --light: #f8f9fc;
            --dark: #5a5c69;
        }
        
        body {
            background-color: #f8f9fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 1.5rem;
            margin: -1rem -1rem 2rem -1rem;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .table-view {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .table thead th {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            font-weight: 600;
        }
        
        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
        }
        
        .table tbody tr:hover {
            background-color: #f8f9fc;
        }
        
        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .status-paid {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        
        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-canceled {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .price-text {
            font-weight: 600;
            color: var(--success);
        }
        
        .action-buttons .btn {
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .table-responsive {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body class="container mt-4">
    <!-- Header -->
    <div class="page-header">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="bi bi-receipt-cutoff me-2"></i>Quản lý hóa đơn</h1>
            <a th:href="@{/admin}" class="btn btn-light">
                <i class="bi bi-arrow-left me-1"></i>Về Dashboard
            </a>
        </div>
    </div>

    <!-- Search Form -->
    <div class="table-view mb-4">
        <div class="p-3">
            <h5 class="mb-3"><i class="bi bi-search me-2"></i>Tìm kiếm hóa đơn</h5>
            <form method="get" action="/admin/invoices" class="row g-3">
                <div class="col-md-3">
                    <label for="movieName" class="form-label">Tên phim</label>
                    <input type="text" 
                           class="form-control" 
                           id="movieName" 
                           name="movieName" 
                           th:value="${searchMovieName}"
                           placeholder="Nhập tên phim...">
                </div>
                <div class="col-md-2">
                    <label for="month" class="form-label">Tháng</label>
                    <select class="form-select" id="month" name="month">
                        <option value="">Tất cả</option>
                        <option th:each="m : ${#numbers.sequence(1, 12)}" 
                                th:value="${m}" 
                                th:text="${m}"
                                th:selected="${searchMonth != null && searchMonth == m}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="year" class="form-label">Năm</label>
                    <input type="number" 
                           class="form-control" 
                           id="year" 
                           name="year" 
                           th:value="${searchYear != null ? searchYear : #temporals.year(#temporals.createToday())}"
                           placeholder="2025"
                           min="2020" 
                           max="2030">
                </div>
                <div class="col-md-5 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary me-2">
                        <i class="bi bi-search me-1"></i>Tìm kiếm
                    </button>
                    <a th:href="@{/admin/invoices}" class="btn btn-secondary">
                        <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Summary Card (chỉ hiển thị khi có tìm kiếm) -->
    <div th:if="${isSearching}" class="table-view mb-4">
        <div class="p-4">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h5 class="mb-0">
                        <i class="bi bi-info-circle me-2 text-primary"></i>
                        Kết quả tìm kiếm: <strong th:text="${invoiceCount}"></strong> hóa đơn
                    </h5>
                </div>
                <div class="col-md-4 text-end">
                    <div class="d-flex flex-column align-items-end">
                        <small class="text-muted mb-1">Tổng tiền</small>
                        <h3 class="mb-0 text-success fw-bold">
                            <i class="bi bi-currency-exchange me-2"></i>
                            <span th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        </h3>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Table View -->
    <div class="table-view">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên phim</th>
                        <th>Phòng</th>
                        <th>Ngày chiếu</th>
                        <th>Giờ chiếu</th>
                        <th>Ghế</th>
                        <th>Tổng tiền</th>
                        <th>Phương thức</th>
                        <th>Trạng thái</th>
                        <th>Thời gian tạo</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${invoices.isEmpty()}">
                        <td colspan="11" class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                            <p class="mt-2">Không có hóa đơn nào</p>
                        </td>
                    </tr>
                    <tr th:each="invoice : ${invoices}">
                        <td th:text="${invoice.id}"></td>
                        <td>
                            <strong th:text="${invoice.movieName}"></strong>
                        </td>
                        <td th:text="${invoice.roomName}"></td>
                        <td th:text="${#temporals.format(invoice.showDate, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(invoice.showTime, 'HH:mm')}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${invoice.seatCodes}"></span>
                        </td>
                        <td>
                            <span class="price-text" th:text="${#numbers.formatDecimal(invoice.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        </td>
                        <td>
                            <span th:if="${invoice.paymentMethodId != 0 && paymentMethodMap.containsKey(invoice.paymentMethodId)}" 
                                  th:text="${paymentMethodMap.get(invoice.paymentMethodId)}"
                                  class="badge bg-info"></span>
                            <span th:if="${invoice.paymentMethodId == 0 || !paymentMethodMap.containsKey(invoice.paymentMethodId)}" 
                                  class="text-muted">-</span>
                        </td>
                        <td>
                            <span th:if="${invoice.status == 0}" class="status-badge status-pending">
                                <i class="bi bi-clock-history me-1"></i>Chờ thanh toán
                            </span>
                            <span th:if="${invoice.status == 1}" class="status-badge status-paid">
                                <i class="bi bi-check-circle me-1"></i>Đã thanh toán
                            </span>
                            <span th:if="${invoice.status == 2}" class="status-badge status-completed">
                                <i class="bi bi-check2-all me-1"></i>Hoàn thành
                            </span>
                            <span th:if="${invoice.status == 3}" class="status-badge status-canceled">
                                <i class="bi bi-x-circle me-1"></i>Đã hủy
                            </span>
                        </td>
                        <td>
                            <small th:text="${#temporals.format(invoice.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <a th:href="@{'/admin/invoices/' + ${invoice.id}}" 
                                   class="btn btn-info btn-sm" 
                                   title="Xem chi tiết">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
