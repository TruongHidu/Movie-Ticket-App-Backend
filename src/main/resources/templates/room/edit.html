<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Sửa phòng chiếu')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('rooms')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Phòng chiếu', '/admin/rooms', 'Chỉnh sửa')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1 th:text="${room.tenPhongChieu}">Sửa phòng chiếu</h1>
                    <p th:text="'Mã phòng ' + ${room.idPhongChieu}"></p>
                </div>
                <span th:replace="~{fragments/admin :: activeStatus(${room.status}, 'Hoạt động', 'Đã khóa')}"></span>
            </div>

            <form th:action="@{/admin/rooms/edit/{id}(id=${room.idPhongChieu})}" method="post" class="form-narrow">
                <section class="panel">
                    <div class="panel-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Mã phòng</label>
                                <input type="text" class="form-control" th:value="${room.idPhongChieu}" readonly>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label" for="tenPhongChieu">Tên phòng<span class="req">*</span></label>
                                <input type="text" id="tenPhongChieu" class="form-control" name="tenPhongChieu" th:value="${room.tenPhongChieu}" required>
                            </div>
                        </div>
                        <p class="form-text mt-3 mb-0"><i class="bi bi-info-circle me-1"></i>Khóa / mở phòng bằng nút trên trang danh sách.</p>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/rooms}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Lưu thay đổi</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
