<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Edit Room</h1>

<form th:action="@{/admin/rooms/edit/{id}(id=${room.idPhongChieu})}" method="post">
    <div class="mb-3">
        <label>ID</label>
        <input type="text" class="form-control" th:value="${room.idPhongChieu}" readonly>
    </div>
    <div class="mb-3">
        <label>Name</label>
        <input type="text" class="form-control" name="tenPhongChieu" th:value="${room.tenPhongChieu}" required>
    </div>
    <div class="mb-3">
        <label>Status</label>
        <input type="text" class="form-control" th:value="${room.status}" readonly>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/admin/rooms}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
