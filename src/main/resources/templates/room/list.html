<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Phòng chiếu')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('rooms')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Phòng chiếu')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Phòng chiếu</h1>
                    <p><span th:text="${rooms != null ? rooms.size() : 0}">0</span> phòng</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/admin/rooms/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm phòng</a>
                </div>
            </div>

            <th:block th:if="${rooms != null and !rooms.empty}">
                <div class="toolbar">
                    <div class="toolbar-left">
                        <div class="seg" data-status-filter="[data-row]" role="group" aria-label="Lọc theo trạng thái">
                            <button type="button" class="active" data-value="">Tất cả</button>
                            <button type="button" data-value="1">Hoạt động</button>
                            <button type="button" data-value="0">Đã khóa</button>
                        </div>
                    </div>
                    <div class="toolbar-right">
                        <div class="seg" data-view-toggle="card" role="group" aria-label="Chế độ xem">
                            <button type="button" data-view="card"><i class="bi bi-grid"></i>Thẻ</button>
                            <button type="button" data-view="table"><i class="bi bi-list-ul"></i>Bảng</button>
                        </div>
                    </div>
                </div>

                <div class="card-grid" data-view-panel="card">
                    <div class="tile-card" th:each="room : ${rooms}" data-row th:data-status="${room.status}">
                        <div class="tile-top">
                            <span class="tile-icon"><i class="bi bi-camera-reels"></i></span>
                            <span th:replace="~{fragments/admin :: activeStatus(${room.status}, 'Hoạt động', 'Đã khóa')}"></span>
                        </div>
                        <div>
                            <h3 class="tile-title" th:text="${room.tenPhongChieu}">Phòng 1</h3>
                            <div class="tile-sub" th:text="'Mã phòng: ' + ${room.idPhongChieu}"></div>
                        </div>
                        <div class="tile-foot">
                            <a th:href="@{'/admin/rooms/edit/' + ${room.idPhongChieu}}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i>Sửa</a>
                            <form th:action="@{'/admin/rooms/status/' + ${room.idPhongChieu}}" method="post"
                                  th:data-confirm="${room.status == 1} ? 'Khóa phòng chiếu này?' : 'Mở lại phòng chiếu này?'">
                                <button type="submit" class="btn btn-sm" th:classappend="${room.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'">
                                    <th:block th:if="${room.status == 1}"><i class="bi bi-lock"></i>Khóa</th:block>
                                    <th:block th:if="${room.status != 1}"><i class="bi bi-unlock"></i>Mở khóa</th:block>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <section class="panel" data-view-panel="table" hidden>
                    <div class="table-wrap">
                        <table class="table table-modern table-hover">
                            <thead>
                            <tr>
                                <th>Mã phòng</th>
                                <th>Tên phòng</th>
                                <th>Trạng thái</th>
                                <th class="actions-col">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="room : ${rooms}" data-row th:data-status="${room.status}">
                                <td class="id-col" th:text="${room.idPhongChieu}"></td>
                                <td class="fw-600" th:text="${room.tenPhongChieu}"></td>
                                <td><span th:replace="~{fragments/admin :: activeStatus(${room.status}, 'Hoạt động', 'Đã khóa')}"></span></td>
                                <td class="actions-col">
                                    <div class="row-actions">
                                        <a th:href="@{'/admin/rooms/edit/' + ${room.idPhongChieu}}" class="btn btn-light btn-icon btn-sm" title="Sửa"><i class="bi bi-pencil"></i></a>
                                        <form th:action="@{'/admin/rooms/status/' + ${room.idPhongChieu}}" method="post"
                                              th:data-confirm="${room.status == 1} ? 'Khóa phòng chiếu này?' : 'Mở lại phòng chiếu này?'">
                                            <button type="submit" class="btn btn-icon btn-sm"
                                                    th:classappend="${room.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'"
                                                    th:title="${room.status == 1} ? 'Khóa' : 'Mở khóa'">
                                                <i class="bi" th:classappend="${room.status == 1} ? 'bi-lock' : 'bi-unlock'"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </th:block>

            <section class="panel" th:if="${rooms == null or rooms.empty}">
                <div class="empty-state">
                    <div class="icon"><i class="bi bi-door-open"></i></div>
                    <h5>Chưa có phòng chiếu</h5>
                    <p>Thêm phòng chiếu để bắt đầu lên lịch.</p>
                    <a th:href="@{/admin/rooms/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm phòng</a>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
