<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Add Room</h1>
<form th:action="@{/admin/rooms/add}" th:object="${room}" method="post">
    <div class="mb-3">
        <label>Name</label>
        <input type="text" class="form-control" th:field="*{tenPhongChieu}" required>
    </div>
    <div class="mb-3">
        <label>Status</label>
        <input type="number" class="form-control" th:field="*{status}" value="1">
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/admin/rooms}" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
