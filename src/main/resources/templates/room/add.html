<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Thêm phòng chiếu')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('rooms')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Phòng chiếu', '/admin/rooms', 'Thêm mới')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Thêm phòng chiếu</h1>
                    <p>Mã phòng được hệ thống tự sinh (VD: PC010).</p>
                </div>
            </div>

            <form th:action="@{/admin/rooms/add}" th:object="${room}" method="post" class="form-narrow">
                <section class="panel">
                    <div class="panel-body">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label" for="tenPhongChieu">Tên phòng<span class="req">*</span></label>
                                <input type="text" id="tenPhongChieu" class="form-control" th:field="*{tenPhongChieu}" placeholder="VD: Phòng 5 — IMAX" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="status">Trạng thái</label>
                                <select id="status" class="form-select" th:field="*{status}">
                                    <option value="1">Hoạt động</option>
                                    <option value="0">Khóa</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/rooms}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Lưu phòng</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
