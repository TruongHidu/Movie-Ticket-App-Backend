<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Sửa khung giờ')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('showtimes')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Khung giờ chiếu', '/admin/showtimes', 'Chỉnh sửa')}"></header>

        <main class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Sửa khung giờ chiếu</h1>
                    <p th:text="'Mã #' + ${showtime.idXuatChieu}"></p>
                </div>
                <span th:replace="~{fragments/admin :: activeStatus(${showtime.status}, 'Hoạt động', 'Đã khóa')}"></span>
            </div>

            <form th:action="@{/admin/showtimes/edit/{id}(id=${showtime.idXuatChieu})}" method="post" class="form-narrow" style="max-width:560px">
                <section class="panel">
                    <div class="panel-body">
                        <label class="form-label" for="khungGio">Giờ chiếu<span class="req">*</span></label>
                        <input type="time" id="khungGio" class="form-control" name="khungGio"
                               th:value="${#temporals.format(showtime.khungGio, 'HH:mm')}" required>
                        <p class="form-text mt-3 mb-0"><i class="bi bi-info-circle me-1"></i>Khóa / mở khung giờ bằng nút trên trang danh sách.</p>
                    </div>
                    <div class="panel-foot">
                        <a th:href="@{/admin/showtimes}" class="btn btn-light">Hủy</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i>Lưu thay đổi</button>
                    </div>
                </section>
            </form>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
