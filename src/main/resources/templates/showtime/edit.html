<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Showtime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Edit Showtime</h1>

<form th:action="@{/admin/showtimes/edit/{id}(id=${showtime.idXuatChieu})}" method="post">
    <div class="mb-3">
        <label>ID</label>
        <input type="text" class="form-control" th:value="${showtime.idXuatChieu}" readonly>
    </div>
    <div class="mb-3">
        <label>Khung giờ</label>
        <!-- LocalTime thì input type="time" sẽ tự nhận giá trị "HH:mm" -->
        <input type="time" class="form-control" name="khungGio"
               th:value="${showtime.khungGio}" required>
    </div>
    <div class="mb-3">
        <label>Status</label>
        <input type="text" class="form-control" th:value="${showtime.status == 1 ? 'Hoạt động' : 'Khóa'}" readonly>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/admin/showtimes}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
