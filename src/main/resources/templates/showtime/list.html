<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/admin :: head('Khung giờ chiếu')}"></head>
<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('showtimes')}"></aside>
    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar(null, null, 'Khung giờ chiếu')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1>Khung giờ chiếu</h1>
                    <p>Các mốc giờ trong ngày dùng để xếp lịch chiếu.</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/admin/showtimes/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm khung giờ</a>
                </div>
            </div>

            <th:block th:if="${!showtimes.isEmpty()}">
                <div class="toolbar">
                    <div class="seg" data-status-filter="[data-row]" role="group" aria-label="Lọc theo trạng thái">
                        <button type="button" class="active" data-value="">Tất cả</button>
                        <button type="button" data-value="1">Hoạt động</button>
                        <button type="button" data-value="0">Đã khóa</button>
                    </div>
                </div>

                <div class="card-grid" style="grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));">
                    <div class="tile-card" th:each="st : ${showtimes}" data-row th:data-status="${st.status}">
                        <div class="tile-top">
                            <span class="tile-icon"><i class="bi bi-clock"></i></span>
                            <span th:replace="~{fragments/admin :: activeStatus(${st.status}, 'Hoạt động', 'Đã khóa')}"></span>
                        </div>
                        <div>
                            <div class="stat-value" th:text="${#temporals.format(st.khungGio, 'HH:mm')}">09:00</div>
                            <div class="tile-sub" th:text="'Mã #' + ${st.idXuatChieu}"></div>
                        </div>
                        <div class="tile-foot">
                            <a th:href="@{/admin/showtimes/edit/{id}(id=${st.idXuatChieu})}" class="btn btn-light btn-sm"><i class="bi bi-pencil"></i>Sửa</a>
                            <form th:action="@{'/admin/showtimes/status/' + ${st.idXuatChieu}}" method="post"
                                  th:data-confirm="${st.status == 1} ? 'Khóa khung giờ này?' : 'Mở lại khung giờ này?'">
                                <button type="submit" class="btn btn-sm" th:classappend="${st.status == 1} ? 'btn-soft-warning' : 'btn-soft-success'">
                                    <th:block th:if="${st.status == 1}"><i class="bi bi-lock"></i>Khóa</th:block>
                                    <th:block th:if="${st.status != 1}"><i class="bi bi-unlock"></i>Mở</th:block>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </th:block>

            <section class="panel" th:if="${showtimes.isEmpty()}">
                <div class="empty-state">
                    <div class="icon"><i class="bi bi-clock"></i></div>
                    <h5>Chưa có khung giờ</h5>
                    <p>Thêm các mốc giờ chiếu (VD: 09:00, 13:30, 19:45).</p>
                    <a th:href="@{/admin/showtimes/add}" class="btn btn-accent"><i class="bi bi-plus-lg"></i>Thêm khung giờ</a>
                </div>
            </section>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
