<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Showtime List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Showtime List</h1>
<a th:href="@{/admin/showtimes/add}" class="btn btn-primary mb-3">Add Showtime</a>
<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Khung giờ</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="st : ${showtimes}">
        <td th:text="${st.idXuatChieu}"></td>
        <td th:text="${st.khungGio}"></td>
        <td th:text="${st.status == 1 ? 'Hoạt động' : 'Khóa'}"></td>
        <td>
            <a th:href="@{/admin/showtimes/edit/{id}(id=${st.idXuatChieu})}" class="btn btn-warning btn-sm">Edit</a>
           <form th:action="@{'/admin/showtimes/status/' + ${st.idXuatChieu}}" method="post" style="display:inline">
    <button type="submit" class="btn btn-warning btn-sm">
        <span th:text="${st.status == 1 ? 'Khóa' : 'Mở'}"></span>
    </button>
</form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
