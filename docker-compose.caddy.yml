# Chỉ dùng trên VPS: nối app vào mạng Docker của Caddy (container pos-saas-web-1)
# để Caddy gọi được app qua tên "movie-ticket-app:8081".
#
# Bật bằng cách thêm vào .env trên VPS:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml
services:
  app:
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-pos-saas_default}
